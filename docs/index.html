<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KTZ Live</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#101b2b;color:white;font:16px system-ui}header{padding:20px 28px}h1{margin:0}small,.note{color:#adc4d2}main{display:grid;grid-template-columns:1fr 360px;height:calc(100vh - 112px)}#map{height:100%}aside{padding:20px;background:#192b40;overflow:auto}article{padding:12px;background:#29425a;border-radius:10px;margin:8px 0}.note{font-size:13px;line-height:1.5}a{color:#79dcc9}button{background:#29425a;color:white;border:1px solid #79dcc9;border-radius:8px;padding:8px;cursor:pointer}@media(max-width:700px){main{display:block}#map{height:48vh}aside{height:45vh}}</style><header><h1>KTZ Live</h1><small>Official station timetables · updated twice an hour</small></header><main><div id="map" role="application" aria-label="Map of sampled railway stations"></div><aside><h2 id="count">Loading timetable…</h2><p class="note" id="status"></p><button id="all" type="button">Show all stations</button><div id="list"></div><p class="note">These markers show sampled stations, not train locations. Times are published timetable data; they do not confirm a train is running or on time. <a href="https://bilet.railways.kz/sale/default/station/schedule">KTZ source</a></p></aside></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="board.js"></script></html>
