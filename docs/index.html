<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KTZ Live</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#101b2b;color:white;font:16px system-ui}header{padding:22px 28px}h1{margin:0}small{color:#adc4d2}main{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 116px)}#map{height:100%}aside{padding:20px;background:#192b40;overflow:auto}article{padding:14px;background:#29425a;border-radius:10px;margin:10px 0}.note{font-size:13px;line-height:1.5;color:#b9ccd6}@media(max-width:700px){main{display:block}#map{height:55vh}}</style><header><h1>KTZ Live</h1><small>Interactive Kazakhstan train map · simulation</small></header><main><div id="map"></div><aside><h2 id="count">Routes</h2><small id="clock"></small><div id="list"></div><p class="note">These are synthetic trips on approximate straight-line routes. They are not KTZ GPS locations or verified schedules. Do not use them for travel decisions. <a href="https://tablo-railways.kz/ru/">Official KTZ board</a></p></aside></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const routes=[['Astana','Almaty',51.1694,71.4491,43.2389,76.8897],['Almaty','Shymkent',43.2389,76.8897,42.3417,69.5901],['Astana','Karaganda',51.1694,71.4491,49.806,73.085],['Aktobe','Atyrau',50.2839,57.167,47.0945,51.9238],['Shymkent','Turkistan',42.3417,69.5901,43.2973,68.2518]];
const map=L.map('map').setView([48,67.5],5),layer=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
function update(){layer.clearLayers();const now=Date.now(),day=86400000;document.querySelector('#clock').textContent='Simulation updated '+new Date(now).toLocaleTimeString();document.querySelector('#count').textContent=routes.length+' simulated routes';document.querySelector('#list').replaceChildren(...routes.map((r,i)=>{const t=((now/day+i*.17)%1),s=t*t*(3-2*t),lat=r[2]+(r[4]-r[2])*s,lon=r[3]+(r[5]-r[3])*s;L.polyline([[r[2],r[3]],[r[4],r[5]]],{color:'#5bcab5',opacity:.4}).addTo(layer);L.marker([lat,lon]).addTo(layer).bindPopup('DEMO-'+(i+1)+' · '+r[0]+' → '+r[1]+'<br>Simulated position');const a=document.createElement('article');a.textContent='DEMO-'+(i+1)+' · '+r[0]+' → '+r[1]+' · simulated';return a}));}update();setInterval(update,30000);
</script></html>
