name: Build railway geometry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium==4.3.2
      - run: python test-rail-routes.py && node test-model.js
      - run: curl --fail --location --retry 2 --output /tmp/kazakhstan.osm.pbf https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf
      - run: python build-rail-routes.py /tmp/kazakhstan.osm.pbf
      - uses: actions/upload-artifact@v4
        with:
          name: rail-routes
          path: docs/rail-routes.json
