name: Refresh public station timetables
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node test-model.js && node test-parser.js
      - run: node timetable.js
      - run: |
          git config user.name 'ktz-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/timetable.json
          git diff --cached --quiet || (git commit -m 'Refresh public timetables' && git push)
