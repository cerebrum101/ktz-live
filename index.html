<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KTZ Live — Kazakhstan trains</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#0d1724;color:#e9f2f5;font:15px system-ui}header{padding:22px 30px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:25px}small{color:#9db2bf}main{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 90px)}#map{height:100%}aside{padding:22px;overflow:auto;background:#142437}article{background:#20354a;border-radius:12px;padding:14px;margin:12px 0}b{color:#67e0c1}.badge{background:#39506a;border-radius:20px;padding:5px 10px;font-size:12px}footer{font-size:12px;color:#9db2bf;line-height:1.5}@media(max-width:700px){main{display:block;height:auto}#map{height:55vh}aside{min-height:35vh}}</style><header><div><h1>KTZ Live</h1><small>Kazakhstan passenger train map</small></div><span class="badge" id="status">Loading…</span></header><main><div id="map" role="application" aria-label="Map of Kazakhstan"></div><aside><h2>Trains in motion <span id="count">0</span></h2><small id="time"></small><div id="list"></div><footer>Demonstration trajectories only. These are synthetic routes and times, not verified KTZ schedules or GPS. Each marker is an estimate and must not be used for travel decisions.</footer></aside></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([48.0,67.5],5),markers=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(map);async function refresh(){try{const x=await(await fetch('/api/trains',{cache:'no-store'})).json();markers.clearLayers();document.querySelector('#count').textContent=x.trains.length;document.querySelector('#time').textContent='Updated '+new Date(x.updated).toLocaleTimeString();document.querySelector('#status').textContent='Simulation · 30 s refresh';document.querySelector('#list').replaceChildren(...x.trains.map(t=>{L.marker([t.lat,t.lon]).addTo(markers).bindPopup(`${t.id}: ${t.from} → ${t.to}<br>Estimated demonstration position`);const a=document.createElement('article');a.innerHTML=`<b>${t.id}</b><br>${t.from} → ${t.to}<br><small>Estimated · arrival ${new Date(t.arrival).toLocaleTimeString()}</small>`;return a}));}catch(e){document.querySelector('#status').textContent='Feed unavailable'}}refresh();setInterval(refresh,30000)</script></html>
